<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fce4ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mahima's Diet" />
  <title>Mahima · Personal Diet Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <link rel="stylesheet" href="styles.css" />
  <!-- iOS requires PNG for apple-touch-icon; SVG only works for browser favicon -->
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <h1>🌸 Mahima's Diet</h1>
        <div class="header-meta">Personal · Thyroid-aware · 0 sugar · Gym 4×/week</div>
      </div>
      <div class="header-right">
        <div class="today-pill" id="today-pill">
          <span class="today-day" id="today-day">—</span>
          <span class="today-date" id="today-date">—</span>
        </div>
        <div class="header-buttons">
          <button class="header-btn" onclick="openPeriodModal()">🌸 Cycle</button>
          <button class="header-btn" onclick="openShoppingList()">🛒 Shopping</button>
        </div>
        <div class="sync-status sync-unknown" id="sync-status" title="">
          <span class="sync-dot">⚪</span><span class="sync-text">Checking…</span>
        </div>
      </div>
    </header>

    <div id="warning-banner"></div>

    <div id="day-selector" class="day-selector"></div>

    <div class="dashboard">
      <div id="main-content"></div>
      <aside id="sidebar" class="sidebar"></aside>
    </div>

    <footer class="footer">
      Built with <span class="heart-pulse">♥</span> for Mahima · All data stays in your browser
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    const now = new Date();
    document.getElementById('today-day').textContent =
      now.toLocaleDateString('en-IN', { weekday: 'long' });
    document.getElementById('today-date').textContent =
      now.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  </script>
</body>
</html>
